[server]
enableStaticServing = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/Montserrat-VariableFont_wght.ttf"
weight = "100 900"
style = "normal"

[theme]
base = "dark"
font = "Montserrat"
headingFont = "Montserrat"
primaryColor = "#A4B7D7"
backgroundColor = "#0E1A2B"
secondaryBackgroundColor = "#1B3454"
textColor = "#F4F7FC"
linkColor = "#A4B7D7"
borderColor = "#274472"
baseRadius = "0.75rem"
showWidgetBorder = true
